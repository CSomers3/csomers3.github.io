<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Carl Somers</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
{% if page.draft %}<meta name="robots" content="noindex">{% endif %}
<link rel="icon" href="/backend/favicon.ico" sizes="32x32">
<link rel="icon" href="/backend/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/backend/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..600;1,400&display=swap" rel="stylesheet">
{% if page.math %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('article'), {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}]})"></script>
{% endif %}
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  /* Risograph: everything printed in riso blue, fluorescent pink for links, a sunflower sun */
  :root { --bg: #f9f8f5; --ink: #0b5fa5; --muted: #3d74a8; --rule: #cfe0ee; --accent: #ff3d9a; --surface: #e8eff6; --raised: #ffffff; --code: #eaf1f8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b1a2b; --ink: #bcdcff; --muted: #7aa6cf; --rule: #1d3350; --accent: #ff7ac0; --surface: #10243a; --raised: #1f3a5c; --code: #12253b; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0b1a2b; --ink: #bcdcff; --muted: #7aa6cf; --rule: #1d3350; --accent: #ff7ac0; --surface: #10243a; --raised: #1f3a5c; --code: #12253b; color-scheme: dark; }

  /* Type: one family, three sizes */
  :root { --text: "Archivo", "Helvetica Neue", Arial, sans-serif; --small: 13.5px; --body: 17px; --big: 32px;
    --ease: cubic-bezier(.2, .8, .2, 1); --ease-out: cubic-bezier(.16, 1, .3, 1); }
  @media (max-width: 520px) { :root { --body: 16px; --big: 27px; } }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-size: var(--body);
    line-height: 1.6;
  }
  main { max-width: 620px; margin: 0 auto; padding: 64px 20px 40px; }
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    transition: text-decoration-color .2s, color .2s;
  }
  a:hover { color: var(--accent); text-decoration-color: var(--accent); }

  .mono {
    font-size: var(--small);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .back { text-decoration: none; }
  h1 {
    font-weight: 400; font-size: var(--big); line-height: 1.15;
    margin: 56px 0 8px; letter-spacing: -.01em;
  }
  .date { display: block; margin-bottom: 40px; }

  article p, article ul, article ol { margin: 0 0 1.1em; }
  article ul, article ol { padding-left: 1.3em; }
  article li { margin-bottom: .3em; }
  article h2 { font-weight: 600; font-size: var(--body); margin: 2.2em 0 .4em; }
  article h3 { font-weight: 600; font-size: var(--body); color: var(--muted); margin: 1.6em 0 .3em; }
  article blockquote {
    margin: 1.4em 0; padding: 0 0 0 18px;
    border-left: 2px solid var(--accent); color: var(--muted); font-style: italic;
  }
  article code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em; background: var(--code); padding: .1em .3em; border-radius: 3px;
  }
  article pre {
    background: var(--code); padding: 14px 16px; border-radius: 4px;
    overflow-x: auto; line-height: 1.5; margin: 0 0 1.3em;
  }
  article pre code { background: none; padding: 0; }
  article img { max-width: 100%; height: auto; display: block; margin: 1.6em auto .4em; }
  article img + em { display: block; text-align: center; font-size: var(--small); color: var(--muted); margin-bottom: 1.6em; }
  article hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4em 0; }
  article ul.list { list-style: none; padding: 0; margin: 0; }
  article ul.list li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    margin: 0; padding: 12px 0; border-bottom: 1px solid var(--rule);
  }
  article ul.list li:first-child { border-top: 1px solid var(--rule); }
  article .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

  .colophon {
    max-width: 620px; margin: 72px auto 0; padding: 20px 20px 28px;
    border-top: 1px solid var(--rule);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }

  /* day / night switch: the new theme grows out of the button as a circle */
  .theme { position: relative; display: inline-flex; padding: 1.5px; border-radius: 999px; background: var(--surface); flex-shrink: 0; }
  .theme button {
    position: relative; z-index: 1; width: 25px; height: 25px; padding: 0; border: 0; border-radius: 999px;
    display: grid; place-items: center; background: none; color: var(--muted); cursor: pointer;
    transition: color .2s var(--ease);
  }
  .theme button[aria-checked="true"], .theme button:hover { color: var(--ink); }
  .theme button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme svg { transition: transform .6s var(--ease-out); }
  .theme [data-theme-set="light"][aria-checked="true"] svg { transform: rotate(90deg); }
  .theme [data-theme-set="dark"][aria-checked="true"] svg { transform: rotate(-24deg); }
  .theme-thumb {
    position: absolute; top: 1.5px; left: 1.5px; width: 25px; height: 25px; border-radius: 999px;
    background: var(--raised); box-shadow: inset 0 0 1px rgba(0, 0, 0, .3); transition: transform .32s var(--ease-out);
  }
  .theme[data-on="dark"] .theme-thumb { transform: translateX(25px); }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-new(root) { z-index: 2; }
  html.theme-fade, html.theme-fade * { transition: background-color .26s, color .26s, border-color .26s !important; }

  @media (max-width: 520px) {
    main { padding-top: 40px; }
    h1 { margin-top: 40px; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back mono" href="{{ page.back | default: '/' }}">← {{ page.back_label | default: 'Carl Somers' }}</a>
    <div class="theme" role="radiogroup" aria-label="Theme">
      <span class="theme-thumb" aria-hidden="true"></span>
      <button type="button" role="radio" aria-checked="true" aria-label="Day" data-theme-set="light"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.3M8 13.1v1.3M1.6 8h1.3M13.1 8h1.3M3.5 3.5l.9.9M11.6 11.6l.9.9M3.5 12.5l.9-.9M11.6 4.4l.9-.9"/></svg></button>
      <button type="button" role="radio" aria-checked="false" aria-label="Night" data-theme-set="dark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width=".9" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 9.4A5 5 0 0 1 6.6 3.4a5 5 0 1 0 6 6Z"/></svg></button>
    </div>
  </div>
  <h1>{{ page.title }}</h1>
  {% if page.date %}<span class="date mono">{{ page.date | date: "%B %Y" }}</span>{% else %}<span class="date"></span>{% endif %}
  <article>
{{ content }}
  </article>
</main>
<footer class="colophon mono">
  <span>© {{ site.time | date: "%Y" }} Carl Somers</span>
  <a href="/">home</a>
</footer>
<script>
(() => {
  const root = document.documentElement, ui = document.querySelector('.theme');
  const sys = matchMedia('(prefers-color-scheme: dark)');
  const current = () => root.dataset.theme || (sys.matches ? 'dark' : 'light');
  const sync = () => {
    const t = current();
    ui.dataset.on = t;
    ui.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeSet === t)));
  };
  const apply = t => { root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} sync(); };
  ui.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.themeSet;
    if (t === current()) return;
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      root.classList.add('theme-fade'); apply(t);
      setTimeout(() => root.classList.remove('theme-fade'), 260);
      return;
    }
    const r = b.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(() => apply(t)).ready.then(() => {
      root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 720, easing: 'cubic-bezier(.65, 0, .35, 1)', pseudoElement: '::view-transition-new(root)' });
    }).catch(() => {});
  }));
  sys.addEventListener('change', sync);
  sync();
})();
</script>
</body>
</html>
